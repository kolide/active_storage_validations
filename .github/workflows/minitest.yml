name: MiniTest
on: [push, pull_request]
permissions:
  contents: read

jobs:
  minitest:
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - 2.5
          - 2.6
          - 2.7
          - '3.0'
          - 3.1
        gemfile:
          - rails_5_2
          - rails_6_0
          - rails_6_1
          - rails_7_0
          - rails_next
        image_processor:
          - vips
          - mini_magick
        exclude:
          # ruby 3.1 only supports rails 7.0+
          - ruby: 3.1
            gemfile: rails_5_2
          - ruby: 3.1
            gemfile: rails_6_0
          - ruby: 3.1
            gemfile: rails_6_1
          # ruby 3 only supports rails 6.1+
          - ruby: '3.0'
            gemfile: rails_5_2
          - ruby: '3.0'
            gemfile: rails_6_0
          # rails 7.0 only supports ruby 2.7+
          - ruby: 2.5
            gemfile: rails_7_0
          - ruby: 2.6
            gemfile: rails_7_0
          # rails next only supports ruby 2.7+
          - ruby: 2.5
            gemfile: rails_next
          - ruby: 2.6
            gemfile: rails_next
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # Audit network and disk activity

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get -y install libvips

      - name: Check out code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Set BUNDLE_GEMFILE
        run: echo 'BUNDLE_GEMFILE=${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile' >> $GITHUB_ENV

      - name: Set IMAGE_PROCESSOR
        run: echo 'IMAGE_PROCESSOR=${{ matrix.image_processor }}' >> $GITHUB_ENV

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test
